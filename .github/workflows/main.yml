name: Generar PDF

on:
  push:
    branches:
      - main
    paths:
      - "Laboratorio-Metrologia/**"
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r Laboratorio-Metrologia/python/requirements.txt

      - name: Generar gráficas
        working-directory: Laboratorio-Metrologia/python
        run: |
          python graficas.py

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          # CAMBIO 1: Declarar el directorio de trabajo para evitar problemas con rutas de imágenes en LaTeX
          working_directory: Laboratorio-Metrologia/latex
          root_file: main.tex

      - name: Renombrar PDF final
        # CAMBIO 2: Renombrar el archivo para que no se llame "main.pdf" en la Release
        run: |
          mv Laboratorio-Metrologia/latex/main.pdf Laboratorio-Metrologia/latex/Informe-Metrologia-v${{ github.run_number }}.pdf

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: laboratorio-metrologia-v${{ github.run_number }}
          name: Laboratorio de Metrología v${{ github.run_number }}
          body: |
            Informe de Laboratorio de Metrología.

            Generado automáticamente mediante GitHub Actions.
          files: |
            Laboratorio-Metrologia/latex/Informe-Metrologia-v${{ github.run_number }}.pdf
